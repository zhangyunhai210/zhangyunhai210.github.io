# 使用 Hexo 构建 blog/ 并发布到 GitHub Pages（artifact + deploy-pages）
name: Deploy blog to GitHub Pages

on:
  push:
    branches: [master, main, 'cursor/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 安装依赖、测试与生成站点
        working-directory: blog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm ci
          npm test
          node scripts/patch-pages-config.mjs
          npx hexo generate

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
